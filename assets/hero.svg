<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-label="ilhaam@github terminal profile">
  <title>ilhaam@github: ~/profile</title>

  <defs>
    <!-- ambient glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#8B5CF6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- dotted grid pattern -->
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#21262d"/>
    </pattern>
  </defs>

  <!-- background grid -->
  <rect x="0" y="0" width="760" height="340" fill="url(#grid)"/>

  <!-- pulsing ambient glow -->
  <ellipse cx="380" cy="165" rx="330" ry="150" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;1;0.6" keyTimes="0;0.5;1" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- terminal window -->
  <rect x="20" y="20" width="720" height="300" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

  <!-- title bar -->
  <circle cx="46" cy="42" r="6" fill="#ff5f56"/>
  <circle cx="64" cy="42" r="6" fill="#ffbd2e"/>
  <circle cx="82" cy="42" r="6" fill="#27c93f"/>
  <text x="380" y="47" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8b949e">ilhaam@github: ~/profile</text>
  <line x1="20" y1="56" x2="740" y2="56" stroke="#21262d" stroke-width="1"/>

  <!-- L1: $ whoami -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.057;0.08;1" dur="14s" repeatCount="indefinite"/>
    <text x="48" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#8B5CF6" font-weight="700">$</text>
    <text x="70" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#e6edf3">whoami</text>
  </g>

  <!-- L2: muhammad ilhaam ghiffari -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.129;0.15;1" dur="14s" repeatCount="indefinite"/>
    <text x="48" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#e6edf3">muhammad ilhaam ghiffari</text>
  </g>

  <!-- L3: $ role -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.214;0.236;1" dur="14s" repeatCount="indefinite"/>
    <text x="48" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#8B5CF6" font-weight="700">$</text>
    <text x="70" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#e6edf3">role</text>
  </g>

  <!-- L4: platform engineering · data & ml -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.286;0.307;1" dur="14s" repeatCount="indefinite"/>
    <text x="48" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#e6edf3">platform engineering · data &amp; ml</text>
  </g>

  <!-- L5: $ status -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.386;0.407;1" dur="14s" repeatCount="indefinite"/>
    <text x="48" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#8B5CF6" font-weight="700">$</text>
    <text x="70" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#e6edf3">status</text>
  </g>

  <!-- L6: open to work + green pulse dot -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.457;0.479;1" dur="14s" repeatCount="indefinite"/>
    <text x="48" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#3fb950">open to work</text>
    <circle cx="226" cy="250" r="5" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.3;1" keyTimes="0;0.5;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- L7: bare prompt + blinking block cursor (waiting state) -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.557;0.579;1" dur="14s" repeatCount="indefinite"/>
    <text x="48" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#8B5CF6" font-weight="700">$</text>
    <rect x="68" y="276" width="11" height="24" rx="2" fill="#e6edf3">
      <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.18;0.23;0.27;0.5;1" dur="2.2s" begin="7.8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
